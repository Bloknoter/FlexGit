name: CI

# Every push except main (release.yml calls this workflow for main) and upm (generated package), every pull request, and on demand.
on:
  push:
    branches-ignore: [main, upm]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Tool versions
        run: |
          git --version
          git lfs version
          dotnet --version

      - name: Build and test
        run: dotnet test FlexGit.sln -c Release --logger trx --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
