name: Release

# A release is published when main contains a library version that has no tag yet:
# bump <Version> in src/FlexGit/FlexGit.csproj, add a CHANGELOG.md section, merge to main.
# It creates tag vX.Y.Z + a GitHub Release with FlexGit.dll, and the Unity package on branch upm (tag upm/vX.Y.Z).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed to compare versions

      - name: Read library version
        id: version
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/FlexGit/FlexGit.csproj | head -n 1)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::FlexGit.csproj <Version> '$version' is not semantic (X.Y.Z or X.Y.Z-suffix)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Decide whether to release
        id: decide
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "Tag $tag already exists: nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$tag" | sort -V | tail -n 1)" != "$tag" ]; then
            echo "::error::Version $tag is lower than the latest release $latest"
            exit 1
          fi
          echo "Releasing $tag (previous: ${latest:-none})."
          echo "release=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        if: steps.decide.outputs.release == 'true'
        with:
          dotnet-version: 8.0.x

      - name: Build FlexGit.dll
        if: steps.decide.outputs.release == 'true'
        run: |
          dotnet build src/FlexGit/FlexGit.csproj -c Release -p:ContinuousIntegrationBuild=true
          out=src/FlexGit/bin/Release/netstandard2.1
          mkdir -p dist
          cp "$out/FlexGit.dll" "$out/FlexGit.xml" "$out/FlexGit.pdb" dist/
          ls -l dist

      - name: Extract release notes from CHANGELOG.md
        if: steps.decide.outputs.release == 'true'
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "See [CHANGELOG.md](CHANGELOG.md)." > release-notes.md
          fi
          {
            printf '\n### Install\n'
            printf -- '- **Unity** (Package Manager, *Add package from git URL*): `https://github.com/%s.git#upm/v%s`\n' \
              "$GITHUB_REPOSITORY" "${{ steps.version.outputs.version }}"
            printf -- '- **.NET**: download `FlexGit.dll` below, or reference `src/FlexGit/FlexGit.csproj`.\n'
          } >> release-notes.md
          cat release-notes.md

      - name: Publish Unity package (upm branch + upm/vX.Y.Z tag)
        if: steps.decide.outputs.release == 'true'
        run: bash .github/upm/publish.sh "${{ steps.version.outputs.version }}"

      - name: Create tag and GitHub release
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          prerelease=""
          if [[ "$version" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "v$version" dist/* --target "$GITHUB_SHA" --title "FlexGit $version" --notes-file release-notes.md $prerelease
